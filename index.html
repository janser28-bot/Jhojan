<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Serrano</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== Pantalla de acceso ===== -->
  <section id="screen-login">
    <div class="login-card">
      <div class="login-brand">
        <div class="ember"></div>
        <h1>Agenda Serrano</h1>
        <p>Inicia sesión para ver las tareas del equipo</p>
      </div>
      <form id="form-login">
        <div class="field">
          <label for="login-email">Correo</label>
          <input type="email" id="login-email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
        <div id="login-error" class="login-error hidden"></div>
      </form>
    </div>
  </section>

  <!-- ===== App ===== -->
  <section id="screen-app" class="hidden">
    <header class="topbar">
      <div class="topbar-brand">
        <div class="ember-sm"></div>
        <h1>Agenda Serrano</h1>
      </div>
      <div class="topbar-user">
        <img id="user-avatar" class="avatar" src="" alt="Avatar">
        <button id="btn-settings" class="icon-btn" title="Ajustes">⚙️</button>
        <button id="btn-logout" class="icon-btn" title="Salir">↪</button>
      </div>
    </header>

    <main>
      <div class="ember-progress">
        <div class="ember-progress-head">
          <span>Avance del equipo</span>
          <span id="progress-label">0 / 0 completadas</span>
        </div>
        <div class="ember-track">
          <div id="ember-fill" class="ember-fill" style="width:0%"></div>
        </div>
      </div>

      <div class="toolbar">
        <div class="filters">
          <button class="filter-btn active" data-filter="all">Todas</button>
          <button class="filter-btn" data-filter="pending">Pendientes</button>
          <button class="filter-btn" data-filter="completed">Completadas</button>
          <button class="filter-btn" data-filter="mine">Asignadas a mí</button>
        </div>
        <button id="btn-new-task" class="btn-new">+ Nueva tarea</button>
      </div>

      <div id="task-list" class="task-list"></div>
      <div id="empty-state" class="empty-state hidden">
        <div class="ember-sm" style="margin:0 auto 1.2rem; border-radius:50%; background:linear-gradient(145deg,var(--amber),var(--brick));"></div>
        <p>No hay tareas todavía. Crea la primera con "+ Nueva tarea".</p>
      </div>
    </main>
  </section>

  <!-- ===== Modal: nueva/editar tarea ===== -->
  <div id="modal-task" class="modal-backdrop hidden">
    <div class="modal-card">
      <h2 id="modal-task-title">Nueva tarea</h2>
      <form id="form-task">
        <input type="hidden" id="task-id">
        <div class="field">
          <label for="task-title">Título</label>
          <input type="text" id="task-title" required maxlength="120">
        </div>
        <div class="field">
          <label for="task-desc">Descripción (opcional)</label>
          <textarea id="task-desc" maxlength="500"></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="task-due">Fecha límite (opcional)</label>
            <input type="date" id="task-due">
          </div>
          <div class="field">
            <label for="task-priority">Prioridad</label>
            <select id="task-priority">
              <option value="baja">Baja</option>
              <option value="media" selected>Media</option>
              <option value="alta">Alta</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="task-tags">Etiquetas (separadas por coma)</label>
            <input type="text" id="task-tags" placeholder="obra, urgente, compras">
          </div>
          <div class="field">
            <label for="task-assignee">Responsable</label>
            <select id="task-assignee">
              <option value="">Sin asignar</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="task-file">Adjuntar archivo (imagen, documento, audio o video — opcional)</label>
          <input type="file" id="task-file" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx">
          <div id="task-file-current" class="file-current hidden"></div>
        </div>

        <div class="field">
          <label>Subtareas (opcional)</label>
          <div id="subtask-list" class="subtask-list"></div>
          <div class="subtask-add">
            <input type="text" id="subtask-input" placeholder="Escribe una subtarea y presiona +">
            <button type="button" id="btn-add-subtask" class="btn-secondary">+</button>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close-modal>Cancelar</button>
          <button type="submit" class="btn-primary" style="width:auto; padding:1.1rem 2rem;">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== Modal: ajustes ===== -->
  <div id="modal-settings" class="modal-backdrop hidden">
    <div class="modal-card">
      <h2>Ajustes de perfil</h2>
      <form id="form-settings">
        <img id="settings-avatar-preview" class="avatar-preview" src="" alt="Vista previa avatar">
        <div class="field">
          <label for="settings-nombre">Nombre</label>
          <input type="text" id="settings-nombre" required maxlength="60">
        </div>
        <div class="field">
          <label for="settings-apellidos">Apellidos</label>
          <input type="text" id="settings-apellidos" required maxlength="60">
        </div>
        <div class="field">
          <label for="settings-avatar-file">Foto de avatar</label>
          <input type="file" id="settings-avatar-file" accept="image/*">
          <p id="settings-avatar-status" class="file-hint"></p>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" data-close-modal>Cancelar</button>
          <button type="submit" class="btn-primary" style="width:auto; padding:1.1rem 2rem;">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
